[workspace]
resolver = "2"
members = [
    "crates/sm-core",
    "crates/sm-config",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
tempfile = "3"
